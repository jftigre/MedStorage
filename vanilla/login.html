<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f6">
  <meta name="description" content="Acesse sua conta MedStorage para organizar seus medicamentos.">
  <title>Entrar | MedStorage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: { 50: "#edf8f6", 100: "#d4efea", 700: "#087568", 800: "#075d55", 900: "#104a44" },
            ink: "#18302e",
            mist: "#f4f7f6"
          },
          fontFamily: {
            sans: ["Lexend", "sans-serif"],
            display: ["Epilogue", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-mist font-sans text-ink antialiased">
  <main class="flex min-h-screen items-center justify-center px-4 py-10 sm:px-6">
    <section aria-labelledby="login-title" class="w-full max-w-md rounded-lg border border-teal-100 bg-white px-6 py-8 shadow-[0_18px_55px_rgba(24,48,46,0.08)] sm:px-10 sm:py-10">
      <header class="mb-8 text-center">
        <div aria-hidden="true" class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-teal-700 text-white shadow-sm">
          <span class="material-symbols-outlined text-3xl">medication</span>
        </div>
        <p class="font-display text-lg font-bold text-teal-800">MedStorage</p>
        <h1 id="login-title" class="mt-3 font-display text-2xl font-bold text-ink">Bem-vindo de volta</h1>
        <p class="mt-2 text-sm leading-6 text-slate-700">Entre para organizar seus medicamentos.</p>
      </header>

      <form id="login-form" class="space-y-5" novalidate>
        <div>
          <label for="email" class="mb-2 block text-sm font-semibold text-ink">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="email-error" class="min-h-12 w-full rounded-md border border-slate-400 bg-white px-4 py-3 text-base text-ink outline-none transition placeholder:text-slate-500 focus:border-teal-700 focus:ring-4 focus:ring-teal-100" placeholder="voce@exemplo.com">
          <p id="email-error" class="mt-1.5 hidden text-sm font-medium text-red-700" aria-live="polite"></p>
        </div>

        <div>
          <label for="password" class="mb-2 block text-sm font-semibold text-ink">Senha</label>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" aria-describedby="password-error" class="min-h-12 w-full rounded-md border border-slate-400 bg-white px-4 py-3 pr-20 text-base text-ink outline-none transition placeholder:text-slate-500 focus:border-teal-700 focus:ring-4 focus:ring-teal-100" placeholder="Digite aqui sua senha">
            <button id="toggle-password" type="button" aria-controls="password" aria-pressed="false" class="absolute right-3 top-1/2 -translate-y-1/2 rounded px-1 py-1 text-sm font-semibold text-teal-800 hover:text-teal-900 focus:outline-none focus:ring-4 focus:ring-teal-100">Mostrar</button>
          </div>
          <p id="password-error" class="mt-1.5 hidden text-sm font-medium text-red-700" aria-live="polite"></p>
        </div>

        <p id="form-error" class="hidden rounded-md bg-red-50 px-3 py-2 text-sm font-medium text-red-800" role="alert"></p>
        <button type="submit" class="flex min-h-12 w-full items-center justify-center rounded-md bg-teal-700 px-5 py-3 text-base font-semibold text-white transition hover:bg-teal-800 focus:outline-none focus:ring-4 focus:ring-teal-200 active:bg-teal-900">
          Entrar
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-700">
        Ainda não tem uma conta?
        <a href="cadastro.html" class="font-semibold text-teal-800 underline decoration-teal-700 underline-offset-4 hover:text-teal-900 focus:outline-none focus:ring-4 focus:ring-teal-100">Criar conta</a>
      </p>

      <footer class="mt-8 border-t border-slate-200 pt-5">
        <p class="text-center text-xs leading-5 text-slate-700">Aviso: O MedStorage é uma ferramenta de apoio e não substitui a prescrição e orientação médica.</p>
      </footer>
    </section>
  </main>
  <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
